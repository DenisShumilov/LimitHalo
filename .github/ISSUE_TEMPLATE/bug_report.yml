name: Bug report
description: Report a reproducible, non-sensitive LimitHalo problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach credentials, tokens, raw provider requests/responses, chats, transcripts, browser data, screenshots with private data, absolute user paths, or provider/application logs.** Use only the app's safe diagnostics.
  - type: input
    id: version
    attributes:
      label: LimitHalo version
      description: Copy only the semantic version from Privacy / About.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      options:
        - Per-user installer
        - Portable ZIP
        - Source fixture/demo
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows family and architecture
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected area
      options:
        - HUD or menu
        - Settings or onboarding
        - Codex integration
        - Claude integration
        - Installer or uninstall
        - Portable mode
        - Safe diagnostics
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Visible status or redacted error category
      description: Do not paste raw exception text, paths, hostnames, bodies, or logs.
      placeholder: unavailable / incompatible_protocol
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use fixture/demo values where possible and remove all private data.
      placeholder: |
        1. Open the context menu...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include credentials, raw provider data, chats, browser data, absolute user paths, screenshots with private data, or logs.
          required: true
